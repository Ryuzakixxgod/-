<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="space" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1b1f4b"/>
      <stop offset="100%" stop-color="#05060f"/>
    </radialGradient>
    <radialGradient id="earth" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#4fb3ff"/>
      <stop offset="70%" stop-color="#1c5fb8"/>
      <stop offset="100%" stop-color="#0b2552"/>
    </radialGradient>
    <radialGradient id="glass" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#bfe6ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7fb8e6" stop-opacity="0.35"/>
    </radialGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c9d2de"/>
    </linearGradient>
    <radialGradient id="atmo" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#6fd0ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#6fd0ff" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <rect width="800" height="800" fill="url(#space)"/>

  <g fill="#fff">
    <circle cx="60" cy="80" r="2"/><circle cx="150" cy="200" r="1.5"/>
    <circle cx="700" cy="60" r="2.2"/><circle cx="620" cy="160" r="1.2"/>
    <circle cx="90" cy="420" r="1.8"/><circle cx="740" cy="330" r="1.5"/>
    <circle cx="330" cy="50" r="1.3"/><circle cx="480" cy="110" r="2"/>
    <circle cx="240" cy="330" r="1.1"/><circle cx="560" cy="260" r="1.4"/>
    <circle cx="40" cy="600" r="1.6"/><circle cx="760" cy="520" r="1.2"/>
    <circle cx="200" cy="120" r="1"/><circle cx="410" cy="190" r="1.2"/>
    <circle cx="690" cy="240" r="1"/><circle cx="130" cy="520" r="1.1"/>
  </g>

  <!-- Земля -->
  <circle cx="400" cy="1050" r="520" fill="url(#earth)"/>
  <circle cx="400" cy="1050" r="535" fill="url(#atmo)"/>
  <g fill="#3fa34d" opacity="0.85">
    <path d="M150 640 q60 -40 130 -10 q40 30 10 70 q-70 20 -140 -20z"/>
    <path d="M430 590 q80 -30 150 10 q30 40 -20 60 q-90 10 -130 -30z"/>
    <path d="M600 700 q50 -20 90 20 q-10 40 -60 40 q-40 -20 -30 -60z"/>
  </g>
  <g fill="#fff" opacity="0.55">
    <path d="M250 610 q70 -20 140 0 q-60 15 -140 0z"/>
    <path d="M500 660 q60 -15 120 5 q-50 12 -120 -5z"/>
  </g>

  <!-- Кот-космонавт -->
  <g transform="translate(400 360) rotate(-12)">
    <!-- трос -->
    <path d="M60 110 q120 60 90 160 q-30 90 60 140" fill="none" stroke="#9aa6b6" stroke-width="5" stroke-linecap="round"/>

    <!-- ранец -->
    <rect x="-95" y="30" width="190" height="150" rx="30" fill="#aab5c4"/>
    <!-- тело -->
    <rect x="-80" y="40" width="160" height="150" rx="60" fill="url(#suit)"/>
    <rect x="-35" y="85" width="70" height="45" rx="8" fill="#5a6b82"/>
    <circle cx="-18" cy="100" r="6" fill="#ff5c5c"/>
    <circle cx="0" cy="100" r="6" fill="#ffd34d"/>
    <circle cx="18" cy="100" r="6" fill="#56d67a"/>
    <!-- руки -->
    <rect x="-135" y="60" width="70" height="40" rx="20" fill="url(#suit)" transform="rotate(-25 -100 80)"/>
    <rect x="65" y="60" width="70" height="40" rx="20" fill="url(#suit)" transform="rotate(25 100 80)"/>
    <circle cx="-140" cy="50" r="20" fill="#e8ecf2"/>
    <circle cx="140" cy="50" r="20" fill="#e8ecf2"/>
    <!-- ноги -->
    <rect x="-65" y="170" width="50" height="70" rx="22" fill="url(#suit)"/>
    <rect x="15" y="170" width="50" height="70" rx="22" fill="url(#suit)"/>
    <!-- хвост -->
    <path d="M70 175 q90 10 80 -60 q-5 -30 25 -35" fill="none" stroke="#f29a38" stroke-width="22" stroke-linecap="round"/>

    <!-- голова кота -->
    <polygon points="-78,-95 -58,-165 -18,-115" fill="#f29a38"/>
    <polygon points="78,-95 58,-165 18,-115" fill="#f29a38"/>
    <polygon points="-68,-105 -58,-145 -32,-115" fill="#ffc9a8"/>
    <polygon points="68,-105 58,-145 32,-115" fill="#ffc9a8"/>
    <ellipse cx="0" cy="-60" rx="90" ry="78" fill="#f29a38"/>
    <path d="M-40 -125 q10 20 0 35 M0 -135 q8 20 0 38 M40 -125 q-10 20 0 35" stroke="#d27418" stroke-width="7" fill="none" stroke-linecap="round"/>
    <ellipse cx="0" cy="-30" rx="52" ry="36" fill="#fff3e6"/>
    <!-- глаза -->
    <ellipse cx="-35" cy="-68" rx="17" ry="21" fill="#fff"/>
    <ellipse cx="35" cy="-68" rx="17" ry="21" fill="#fff"/>
    <ellipse cx="-33" cy="-66" rx="9" ry="16" fill="#1d7a3a"/>
    <ellipse cx="37" cy="-66" rx="9" ry="16" fill="#1d7a3a"/>
    <ellipse cx="-33" cy="-66" rx="3.5" ry="12" fill="#111"/>
    <ellipse cx="37" cy="-66" rx="3.5" ry="12" fill="#111"/>
    <circle cx="-29" cy="-74" r="4" fill="#fff"/>
    <circle cx="41" cy="-74" r="4" fill="#fff"/>
    <!-- нос и рот -->
    <path d="M-9 -40 h18 l-9 10z" fill="#ff7f9a"/>
    <path d="M0 -30 q-10 14 -22 6 M0 -30 q10 14 22 6" stroke="#6b3b1f" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- усы -->
    <g stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.9">
      <line x1="-45" y1="-32" x2="-100" y2="-45"/><line x1="-45" y1="-24" x2="-102" y2="-22"/>
      <line x1="45" y1="-32" x2="100" y2="-45"/><line x1="45" y1="-24" x2="102" y2="-22"/>
    </g>

    <!-- шлем -->
    <circle cx="0" cy="-60" r="125" fill="url(#glass)" stroke="#dfe7f1" stroke-width="10"/>
    <path d="M-80 -130 q30 -40 80 -45" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.7"/>
    <rect x="-100" y="45" width="200" height="26" rx="13" fill="#dfe7f1"/>
  </g>
</svg>
